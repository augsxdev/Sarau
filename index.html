<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2eee5" />
    <meta name="description" content="SARAU — bar e clube social. Um lugar para encontros, cultura e noites que ficam." />
    <title>SARAU — Bar & Social Club</title>
    <link rel="preload" as="image" href="assets/sarau-portal-poster.jpg" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="#inicio" aria-label="SARAU, início">SARAU<span>BAR & SOCIAL CLUB</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">
        <span class="menu-toggle__label">Menu</span><span class="menu-toggle__icon" aria-hidden="true"></span>
      </button>
      <nav class="primary-nav" id="primary-nav" aria-label="Navegação principal">
        <a href="#casa">A casa</a>
        <a href="#programacao">Programação</a>
        <a href="#encontros">Encontros</a>
        <a class="nav-booking" href="#reservas">Reservar mesa <span aria-hidden="true">↗</span></a>
      </nav>
    </header>

    <main>
      <section class="hero" id="inicio" aria-labelledby="hero-title">
        <video class="hero__video" autoplay muted playsinline preload="auto" poster="assets/sarau-portal-poster.jpg" aria-label="O interior acolhedor do SARAU se revela por um arco iluminado">
          <source src="assets/sarau-portal-reveal.mp4" type="video/mp4" />
        </video>
        <div class="hero__veil" aria-hidden="true"></div>
        <div class="hero__content">
          <p class="eyebrow"><span></span> Um lugar para ficar mais um pouco</p>
          <h1 id="hero-title">A noite encontra<br /><em>seu lugar.</em></h1>
          <p class="hero__intro">Bar, cultura e encontros em uma casa feita para descobrir sem pressa.</p>
          <div class="hero__actions">
            <a class="button button--terra" href="#programacao">Descobrir o SARAU <span aria-hidden="true">↗</span></a>
            <a class="text-link" href="#casa">Conheça a casa <span aria-hidden="true">↓</span></a>
          </div>
        </div>
        <p class="hero__side-note" aria-hidden="true">Aqui também<br />mora cultura.</p>
        <a class="hero__scroll" href="#casa"><span></span> Role para descobrir</a>
      </section>
